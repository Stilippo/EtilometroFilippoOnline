<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etilometro Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Etilometro Online</h1>
        <p>Calcola il tuo tasso alcolemico stimato</p>
    </header>

    <main>
        <section class="calculator-container">
            <!-- Qui andrà il form per inserire i dati (peso, sesso, bevande, ecc.) -->
            <h2>Calcolatore</h2>
            <p>Il form di calcolo verrà inserito qui.</p>
        </section>

        <section class="results-container">
            <!-- Qui andranno i risultati del calcolo -->
            <h2>Risultati</h2>
            <p>I risultati appariranno qui.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Etilometro Online. <br><small>Nota: Questo strumento fornisce solo una stima e non ha valore legale o medico.</small></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
